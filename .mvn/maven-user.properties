# 发布到 Maven Central 必需。
#
# Maven 4 的 consumer POM 默认不做 flatten：它仍保留 <parent> 引用，而 Central 的标准
# 解析器读到源 pom 里的空 parent 坐标会判 "Invalid POM"；同时源 pom 里 url / licenses /
# developers / scm 都靠继承而来，consumer POM 若不内联这些，Central 逐项报缺失
# （实测一次 deployment 产生 287 条错误，全部是这类元数据缺失）。
#
# flatten=true 让 Maven 生成自包含的 consumer POM：parent 引用解析并内联、BOM 展开、
# 非传递依赖（provided/test/system）剥离。中央只要求 compile/runtime 依赖，正好对得上。
maven.consumer.pom.flatten=true

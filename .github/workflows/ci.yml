name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  # 规模测试（千万行量级 / 60 层深链，依赖 Docker）太重，不放每次 push，改为每周一次 + 手动触发
  schedule:
    - cron: '37 4 * * 1' # 每周一 04:37 UTC

permissions:
  contents: read

# 同一分支的多次 push 只保留最新一次，省构建时长
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 项目要求 Maven 4（pom 是 4.1.0 模型，3.9 读不了）。4.0.0 GA 尚未发布，锁 rc-6 与本地 mise.toml 一致。
  MAVEN_VERSION: 4.0.0-rc-6

jobs:
  test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Maven ${{ env.MAVEN_VERSION }}
        run: |
          MVN_VER="$MAVEN_VERSION"
          curl -fsSL "https://dlcdn.apache.org/maven/maven-4/$MVN_VER/binaries/apache-maven-$MVN_VER-bin.tar.gz" -o "$RUNNER_TEMP/mvn.tgz"
          tar -xzf "$RUNNER_TEMP/mvn.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MVN_VER/bin" >> "$GITHUB_PATH"

      - name: mvn test
        run: mvn -B test

  scale:
    name: Scale tests (Docker)
    runs-on: ubuntu-latest
    # 只在定时或手动触发时跑；push/PR 不跑，避免拉起 Docker 重物化
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Maven ${{ env.MAVEN_VERSION }}
        run: |
          MVN_VER="$MAVEN_VERSION"
          curl -fsSL "https://dlcdn.apache.org/maven/maven-4/$MVN_VER/binaries/apache-maven-$MVN_VER-bin.tar.gz" -o "$RUNNER_TEMP/mvn.tgz"
          tar -xzf "$RUNNER_TEMP/mvn.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MVN_VER/bin" >> "$GITHUB_PATH"

      # ubuntu-latest 自带 Docker 守护进程，testcontainers 直接复用，无需额外 service 容器
      - name: mvn test -Dfacet.scale=true
        run: mvn -B test -Dfacet.scale=true
